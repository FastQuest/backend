name: CI

on:
  push:
    branches: ["main", "feat/ci-github-actions"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate Swagger docs
        run: go run github.com/swaggo/swag/cmd/swag init

      - name: Run tests
        run: go test ./...
