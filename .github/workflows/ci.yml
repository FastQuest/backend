name: CI

on:
  push:
    branches: ["main", "feat/ci-github-actions"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate Swagger docs
        run: go run github.com/swaggo/swag/cmd/swag init

      - name: Run tests
        run: go test ./...

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate Swagger docs
        run: go run github.com/swaggo/swag/cmd/swag init

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o flashquest ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashquest-${{ github.sha }}
          path: flashquest
          retention-days: 7
